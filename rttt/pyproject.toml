[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rttt-attention"
version = "0.1.0"
description = "Zero-shot linear attention, attention sinks, and KV eviction experiments"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=4.44,<4.45",
  "datasets>=3.0,<4",
  "huggingface-hub>=0.24,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
eval = ["lm-eval==0.4.5", "peft>=0.12,<0.13"]

[project.scripts]
rttt = "rttt.cli:main"

[tool.setuptools.packages.find]
include = ["rttt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
